<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan for Brochure – PhytoIngredients</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      padding: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 3rem 3.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.05);
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #4ade80;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 1.4rem;
    }

    .badge::before {
      content: '';
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.4); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
      margin-bottom: 2.2rem;
      font-weight: 300;
      line-height: 1.6;
    }

    .qr-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 4px rgba(255,255,255,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin-bottom: 2rem;
    }

    .qr-wrapper:hover {
      transform: scale(1.03);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 0 4px rgba(255,255,255,0.12);
    }

    canvas { display: block; border-radius: 8px; }

    .url-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.65);
      word-break: break-all;
      margin-bottom: 2rem;
    }

    .url-chip svg { flex-shrink: 0; }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(34,197,94,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(34,197,94,0.5);
      filter: brightness(1.08);
    }

    .download-btn:active { transform: translateY(0); }

    footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">PhytoIngredients</div>

    <h1>Scan to Access<br>Our Brochure</h1>
    <p class="subtitle">Point your camera at the code below to download<br>the product brochure instantly.</p>

    <div class="qr-wrapper">
      <canvas id="qrCanvas"></canvas>
    </div>

    <div class="url-chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      https://www.phytoingredients.com/brochure
    </div>

    <button class="download-btn" id="downloadBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download QR Code (PNG)
    </button>

    <footer>Scan with any smartphone camera · No app required</footer>
  </div>

  <script>
    const url = 'https://www.phytoingredients.com/brochure';
    const canvas = document.getElementById('qrCanvas');

    QRCode.toCanvas(canvas, url, {
      width: 240,
      margin: 2,
      color: { dark: '#0f2027', light: '#ffffff' },
      errorCorrectionLevel: 'H'
    }, (err) => {
      if (err) console.error(err);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'phytoingredients-brochure-qr.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
